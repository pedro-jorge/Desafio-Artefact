services:
  ollama:
    image: ollama/ollama:latest
    container_name: chatbot-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: chatbot-ollama-init
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until OLLAMA_HOST=http://ollama:11434 ollama list; do
          echo "Aguardando Ollama..."
          sleep 2
        done
        OLLAMA_HOST=http://ollama:11434 ollama pull qwen3:8b
    restart: "no"

  app:
    build: .
    container_name: chatbot-app
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./database.db:/app/database.db
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama_data: