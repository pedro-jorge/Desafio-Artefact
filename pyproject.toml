[project]
name = "desafio-artefact"
version = "0.1.0"
description = "Ambiente Poetry do Desafio Técnico da Artefact."
authors = [
    {name = "Pedro Jorge",email = "crf.pedrojorge@gmail.com"}
]
requires-python = ">=3.14, !=3.14.1, <4.0.0"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "langchain (>=1.4.8,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "streamlit (>=1.66.1,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "pymupdf (>=2.1,<3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)",
    "deptry (>=0.25.1,<0.26.0)"
]
